name: Master Branch Push

on:
  push:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  docker-release:
    name: Docker Development Release
    runs-on: ubuntu-latest
    steps:
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Checkout Repository
        uses: actions/checkout@v6
      -
        name: Use release version from package.json
        run: echo "TAG=$(jq -r '.version' package.json)" >> $GITHUB_ENV
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            beanbeanjuice/coffeechat:dev-latest
            beanbeanjuice/coffeechat:dev-${{ env.TAG }}
          provenance: true
          sbom: true

  release-please:
    name: Update Changelog
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      -
        name: Update Version Number and Release to GitHub
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.PERSONAL_PAT }}
          manifest-file: .github/.release-please-manifest.json
          config-file: .github/.release-please-config.json
