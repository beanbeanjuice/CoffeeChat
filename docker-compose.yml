services:
  coffeechat:
    build:
      context: https://github.com/beanbeanjuice/CoffeeChat.git#master
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      CALENDAR_ICS_LINK: ${CALENDAR_ICS_LINK:-}
